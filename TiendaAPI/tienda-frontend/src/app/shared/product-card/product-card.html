<article class="card product-card h-100 border-0 overflow-hidden">
	<img [src]="product.imagen" [alt]="product.nombre" class="card-img-top product-image" />

	<div class="card-body d-flex flex-column">
		<span class="badge rounded-pill category-badge align-self-start">{{ product.categoriaNombre }}</span>
		<h3 class="h5 card-title mt-3 mb-2">{{ product.nombre }}</h3>
		<p class="card-text text-muted flex-grow-1">{{ product.descripcion }}</p>

		<div class="d-flex align-items-center justify-content-between mt-3">
			<strong class="price">{{ product.precio | currency:'USD':'symbol':'1.0-0' }}</strong>
			<small class="text-muted">ID {{ product.id }}</small>
		</div>
	</div>
</article>
